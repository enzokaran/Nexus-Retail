const qs=p=>bs.filter(b=>b.p==p).reduce((a,b)=>a+b.q,0),low=P.filter(p=>(!Fl.cat||p.cat==Fl.cat)&&qs(p.id)<p.min*u.length).sort((a,b)=>qs(a.id)/a.min-qs(b.id)/b.min).slice(0,6);
const mv=[...DB.mov.filter(x=>u.includes(x.s)&&(!Fl.cat||P[x.p].cat==Fl.cat)),...cur.slice(-30).flatMap(y=>y.it.map(i=>({t:y.x.t,s:y.x.s,p:i.p,ty:'Venda',q:-i.q})))].sort((a,b)=>b.t-a.t).slice(0,7);
const perL=per==1?'hoje':per?'últimos '+per+' dias':'todo o histórico';
return bar+`<div class=g>${kc('Faturamento ('+perL+')',fmt(R1),dv(R1,rev(prv)),'o')}${kc('Vendas',N1.toLocaleString('pt-BR'),dv(N1,prv.length))}${kc('Ticket médio',N1?fmt(R1/N1):'—')}${kc('Itens vendidos',itn(cur).toLocaleString('pt-BR'),dv(itn(cur),itn(prv)))}${kc('Margem bruta',mgv.toFixed(1)+'%',per&&prv.length?`<div class=sm style="color:${mgv>=pm0?'var(--ok)':'var(--er)'}">${mgv>=pm0?'▲':'▼'} ${Math.abs(mgv-pm0).toFixed(1)} p.p.</div>`:'','o')}${kc('Itens em estoque',bs.reduce((a,b)=>a+b.q,0).toLocaleString('pt-BR'))}${kc('Lotes vencendo ≤30d',bs.filter(b=>dd(b)>=0&&dd(b)<=30).length,'','o')}<div class=c><span class="mu sm">Lotes vencidos</span><div class=k style="color:var(--er)">${bs.filter(b=>dd(b)<0).length}</div></div></div>
<div class=g2><div class=c><b>Faturamento diário (R$) · ${per==1?'últimos 7 dias':per?perL:'últimos 30 dias'}</b>${bars(dv2,dl2)}</div><div class=c><b>Faturamento por horário (R$)</b>${bars(hv,hv.map((_,i)=>i+7))}<span class="mu sm">Horas do dia, das 7h às 22h</span></div></div>
<div class=g2><div class=c><b>Vendas por ${Fl.cat?'marca':'categoria'}</b><div style="margin-top:8px">${donut(Object.entries(grp))}</div></div><div class=c><b>Formas de pagamento</b><div style="margin-top:8px">${donut(Object.entries(pay))}</div></div></div>
<div class=g2><div class=c><b>Comparação entre unidades</b>${hb(u.map(id=>[S[id].uf+' · '+S[id].c,rev(cur.filter(y=>y.x.s==id))]).sort((a,b)=>b[1]-a[1]))}</div><div class=c><b>Mais vendidos</b>${top.map(([i,q])=>`<div style="display:flex;justify-content:space-between;padding:5px 0">${pn(P[i])}<span>${q} un</span></div>`).join('')||'<p class=mu>Sem vendas neste filtro.</p>'}</div></div>
<div class=g2><div class=c><b>Estoque baixo</b>${low.map(p=>`<div style="display:flex;justify-content:space-between;padding:5px 0">${pn(p)}<span class="b wa">${qs(p.id)} un</span></div>`).join('')||'<p class=mu>Nenhum</p>'}</div><div class=c><b>Últimas movimentações</b>${mv.map(m=>`<div class=sm style="padding:4px 0">${dtm(m.t)} · ${m.ty} ${m.q} · ${P[m.p].nm} · ${S[m.s].uf}</div>`).join('')||'<p class=mu>Nenhuma</p>'}</div></div><p class="mu sm">Dados fictícios para demonstração.</p>`}

function est2(){const rows=P.filter(p=>(!F.cat||p.cat==F.cat)&&(!F.br||p.br==F.br)&&(!F.q||(p.nm+p.br+p.ean+p.sku).toLowerCase().includes(F.q.toLowerCase())));
return T('est',[{h:'Produto',f:p=>pn(p),s:p=>p.nm},{h:'Categoria',f:p=>p.cat,s:p=>p.cat},{h:'EAN',f:p=>p.ean},...S.map(s=>({h:s.uf,f:p=>qty(p.id,s.id),s:p=>qty(p.id,s.id)})),{h:'Rede',f:p=>'<b>'+qty(p.id)+'</b>',s:p=>qty(p.id)},{h:'Situação',f:p=>sb(qty(p.id,sc),p.min)}],rows)}
const RP={loja:()=>[['Unidade','Pedidos','Faturamento'],S.map(s=>{const v=DB.sales.filter(x=>x.s==s.id);return[s.n,v.length,+v.reduce((a,x)=>a+x.tot,0).toFixed(2)]})],
produto:()=>[['Produto','Marca','Qtd vendida','Receita'],P.map(p=>{const l=lines(p.id);return[p.nm,p.br,l.reduce((a,x)=>a+x.q,0),+l.reduce((a,x)=>a+x.q*x.pr,0).toFixed(2)]})],
marca:()=>{const m={};P.forEach(p=>lines(p.id).forEach(x=>{m[p.br]=(m[p.br]||0)+x.q*x.pr}));return[['Marca','Receita'],Object.entries(m).map(([a,b])=>[a,+b.toFixed(2)])]},
critico:()=>[['Produto','Unidade','Qtd','Mínimo'],P.flatMap(p=>S.filter(s=>qty(p.id,s.id)<p.min).map(s=>[p.nm,s.n,qty(p.id,s.id),p.min]))],
vencimentos:()=>[['Lote','Produto','Unidade','Qtd','Validade','Dias'],DB.B.filter(b=>dd(b)<=30).map(b=>[b.l,P[b.p].nm,S[b.s].n,b.q,dt(b.val),dd(b)])],
margem:()=>[['Produto','Marca','Receita','Custo','Margem %'],P.map(p=>{const l=lines(p.id),q=l.reduce((a,x)=>a+x.q,0),v=l.reduce((a,x)=>a+x.q*x.pr,0),c=q*p.cost;return[p.nm,p.br,+v.toFixed(2),+c.toFixed(2),v?+((v-c)/v*100).toFixed(1):0]})],
horario:()=>[['Hora','Vendas','Faturamento'],Array.from({length:16},(_,i)=>{const v=DB.sales.filter(x=>new Date(x.t).getHours()==i+7);return[(i+7)+'h',v.length,+v.reduce((a,x)=>a+x.tot,0).toFixed(2)]})],
semana:()=>[['Dia','Vendas','Faturamento'],['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((n,d)=>{const v=DB.sales.filter(x=>new Date(x.t).getDay()==d);return[n,v.length,+v.reduce((a,x)=>a+x.tot,0).toFixed(2)]})],
notas:()=>[['NF','Data','Fornecedor','Unidade','Itens','Valor'],DB.nf.map(x=>[x.n+'/'+x.serie,dt(x.t),FNL[x.f].n,S[x.s].uf,x.it,x.v])],
comparacao:()=>[['Unidade','Estoque','Lotes críticos','Ticket médio'],S.map(s=>{const v=DB.sales.filter(x=>x.s==s.id);return[s.n,DB.B.filter(b=>b.s==s.id).reduce((a,b)=>a+b.q,0),DB.B.filter(b=>b.s==s.id&&dd(b)<=7).length,+(v.reduce((a,x)=>a+x.tot,0)/v.length).toFixed(2)]})]};
function exp(){const[h,r]=cur,a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h,...r].map(x=>x.join(';')).join('\n')],{type:'text/csv'}));a.download='relatorio.csv';a.click()}
function bsc(c){c=(c||'').trim();const p=P.find(x=>x.ean==c||x.sku==c);if(!p)return toast('EAN não cadastrado');cl();pm(p.id)}
function addP(){const n=$('#nn').value.trim(),e=$('#ne').value.trim(),v=+$('#np').value;if(!n||!/^\d{13}$/.test(e)||!(v>0))return toast('Preencha nome, EAN com 13 dígitos e preço válido');if(P.some(x=>x.ean==e))return toast('EAN já cadastrado');const i=P.length;const nw={id:i,cat:'Mercearia',nm:n,br:'Sem marca',base:v,ean:e,sku:'NX-'+(1000+i),min:10,fn:'—',fi:0,un:'un',cost:+(v*.7).toFixed(2),pop:1};P.push(nw);DB.cp.push(nw);DB.pr.push(S.map(()=>v));save();audit('Cadastrou produto '+n+' (EAN '+e+')');toast('Produto cadastrado e salvo')}
function pe(id){op(`<h3>${P[id].nm}</h3><p class=mu>Alteração registrada com usuário e horário.</p><div class=fl><select id=es>${S.map(s=>`<option value=${s.id}>${s.n}</option>`).join('')}<option value=all>Todas</option></select><input id=ev type=number step=.01 placeholder="Novo preço"></div><button class=p onclick="pe2(${id})">Confirmar</button> <button onclick="cl()">Cancelar</button>`)}
function pe2(id){const v=+$('#ev').value,t=$('#es').value;if(!(v>0))return toast('Preço inválido');(t=='all'?S.map(s=>s.id):[+t]).forEach(s=>{DB.hist.push({t:Date.now(),u:me.u,p:id,s,a:DB.pr[id][s],n:v});DB.pr[id][s]=v});audit('Alterou preço: '+P[id].nm+' → '+fmt(v)+' ('+(t=='all'?'todas as unidades':S[+t].uf)+')');cl();go();toast('Preço atualizado — reflete no PDV')}
function padd(c){c=(c||'').trim();const p=P.find(x=>x.ean==c||x.sku==c),s=sc=='all'?0:sc;if(!p)return toast('Produto não encontrado');const i=cart.find(x=>x.p==p.id),q=(i?i.q:0)+1;if(q>qv(p.id,s))return toast('Estoque insuficiente na unidade (lotes vencidos não são vendidos)');i?i.q=q:cart.push({p:p.id,q:1});cl();go();$('#pi')&&$('#pi').focus()}
function cq(k,d){const s=sc=='all'?0:sc,i=cart[k];if(i.q+d>qv(i.p,s))return toast('Estoque insuficiente (lotes vencidos não são vendidos)');i.q+=d;if(i.q<1)cart.splice(k,1);go()}
function fin(s){if(!cart.length)return toast('Carrinho vazio');const it=cart.map(i=>({p:i.p,q:i.q,pr:pv(i.p,s)*(1-disc/100)}));cart.forEach(i=>{let n=i.q;DB.B.filter(b=>b.p==i.p&&b.s==s&&b.q>0&&b.val>Date.now()).sort((a,b)=>a.val-b.val).forEach(b=>{const t=Math.min(n,b.q);b.q-=t;n-=t});DB.mov.push({t:Date.now(),s,p:i.p,ty:'Venda PDV',q:-i.q})});const tot=it.reduce((a,x)=>a+x.q*x.pr,0);DB.sales.push({id:DB.sales.length+1,t:Date.now(),s,pay,it,tot,op:me.n});audit('Venda PDV '+fmt(tot)+' · '+S[s].n+' · '+pay);cart=[];disc=0;go();toast('Venda registrada: '+fmt(tot)+' — estoque atualizado (FEFO)')}
async function cam(cb){if(!('BarcodeDetector' in window))return toast('Leitura por câmera indisponível neste navegador');try{op('<video id=vv autoplay playsinline style="width:100%;border-radius:10px"></video><p class=mu>Aponte para o código…</p>');window.cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#vv').srcObject=cs;const d=new BarcodeDetector();const lp=async()=>{if(!window.cs)return;try{const c=await d.detect($('#vv'));if(c.length){const v=c[0].rawValue;cl();return cb(v)}}catch(e){}setTimeout(lp,400)};lp()}catch(e){cl();toast('Câmera indisponível')}}
try{const u=sessionStorage.getItem('nxs');if(u){me=[...U,...DB.us].find(x=>x.u==u);me&&start()}}catch(e){}
